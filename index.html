<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNION — Catálogo 2026</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #050505;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

/* CATÁLOGO */
.catalogo {
  width: 100%;
  max-width: 582px;
  min-height: 100vh;
  background: #080808;
  overflow: hidden;
}

/* PORTADA */
.portada {
  width: 100%;
  height: 100vh;
  min-height: 826px;
  position: relative;
  overflow: hidden;
  background: #050505;
}

.portada img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* BOTÓN */
.boton {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 30px;
  border: 1px solid rgba(255,255,255,.6);
  border-radius: 40px;
  color: white;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(10px);
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: .3s;
}

.boton:hover {
  background: white;
  color: black;
}

/* SEGUNDA PÁGINA */
.pagina {
  min-height: 100vh;
  padding: 60px 25px;
  background: #f5f5f5;
  color: #111;
}

.pagina h1 {
  font-size: 42px;
  letter-spacing: -2px;
  margin-bottom: 10px;
}

.pagina p {
  color: #666;
  font-size: 15px;
}

/* ANIMACIÓN */
.aparecer {
  animation: aparecer 1.2s ease forwards;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: scale(1.04);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<div class="catalogo">

  <!-- PORTADA -->
  <section class="portada aparecer">

    <img src="portada" alt="Catálogo UNION 2026">

    <button class="boton" onclick="irAlCatalogo()">
      VER CATÁLOGO
    </button>

  </section>

  <!-- PRIMERA PÁGINA -->
  <section class="pagina" id="catalogo">

    <p>UNION · 2026</p>

    <h1>EL DEPORTE<br>NOS UNE.</h1>

    <p>
      Descubre nuestra nueva colección.
    </p>

  </section>

</div>

<script>

function irAlCatalogo() {
  document.getElementById("catalogo").scrollIntoView({
    behavior: "smooth"
  });
}

</script>

</body>
</html>
